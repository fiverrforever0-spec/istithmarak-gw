name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Link Android SDK
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV

      - name: Download Gradle 8.5
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          echo "$PWD/gradle-8.5/bin" >> $GITHUB_PATH

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace --no-daemon
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: istithmarak-gateway-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Show Error Log
        if: failure()
        run: |
          echo "=== Gradle Error ==="
          find . -name "*.log" -exec cat {} \; 2>/dev/null || true
          ls -la app/build/outputs/ 2>/dev/null || true
